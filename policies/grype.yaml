  # Oracle Linux 8/9: every one of these advisories is Oracle's separate
  # FIPS-validated module build (epoch 10, "_fips" suffix, published on
  # Oracle's *_security_validation channel), not the regular package's
  # upgrade path. Verified directly against the advisory text (e.g.
  # linux.oracle.com/errata/ELSA-2026-50075.html states explicitly: "not
  # applicable to general Oracle Linux 9 ... installations"). grype matches
  # the FIPS-track epoch as if it were the fix for the non-FIPS package we
  # actually installed. Review 2026-08-28.
  - vulnerability: ELSA-2022-9221
    package: { name: gnutls }
    reason: "Oracle Linux 8 FIPS-module-track false match (see header). Review 2026-08-28."
  - vulnerability: ELSA-2022-9263
    package: { name: libgcrypt }
    reason: "Oracle Linux 8 FIPS-module-track false match (see header). Review 2026-08-28."
