# Grype policy: gate builds on fixable High/Critical findings.
check-for-app-update: false
only-fixed: true
fail-on-severity: high
ignore:
  # Example of a documented, time-boxed exception:
  # - vulnerability: CVE-2025-XXXXX
  #   reason: "No fix released upstream; mitigated by removed binary. Review 2026-08-01."
  - vulnerability: CVE-2026-4878
    package:
      name: libcap
    reason: "Fixed in RHEL (libcap-2.48-10.el9_8.1) but Rocky 9 mirrors still ship el9_7.1; not yet installable. Review 2026-08-01."
  - vulnerability: CVE-2026-15308
    reason: "python3/python3-libs fixed in RHEL (el9_8.2) but Rocky 9 still ships el9_8 even on dl.rockylinux.org; not yet installable. Review 2026-08-01."

  # CentOS Stream 9/10: grype's fixed-version data for these packages is
  # RHEL's own point-release scheme (el9_N/el10_N), which CentOS Stream
  # packages never carry — Stream only ever increments the bare release
  # number (.el9, .el10). Verified against the live mirror
  # (mirror.stream.centos.org/{9,10}-stream/...) that our build already has
  # the newest package CentOS Stream currently publishes for each of these
  # (e.g. glibc-2.34-274.el9, libarchive-3.5.3-9.el9 are the latest listed).
  # This is a structural version-scheme mismatch, not a build gap, and will
  # recur for new CVEs indefinitely since Stream will never produce an
  # el9_N/el10_N tag. Review 2026-08-28 and prune/refresh as needed.
  - vulnerability: CVE-2026-5121
    package: { name: libarchive }
    reason: "CentOS Stream 9 el9_N version-scheme mismatch (see header). Review 2026-08-28."
  - vulnerability: CVE-2026-4424
    package: { name: libarchive }
    reason: "CentOS Stream el9_N/el10_N version-scheme mismatch (see header); affects Stream 9 and 10. Review 2026-08-28."
